<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arts — Rudolf Westerholm</title>
<meta name="description" content="Visual arts by Rudolf Westerholm." />
<link rel="icon" type="image/png" href="/assets/favicon_rudolf.png" />
<link rel="stylesheet" href="/shiro-nav.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Instrument Sans",sans-serif; background:#fbfbfa; color:#111; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  nav.shiro-nav { border-bottom:1px solid #e8e5dd; }
  .eyebrow { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:#666560; font-weight:600; margin:0 0 8px; }
  .font-display { font-family:"Cormorant Garamond",serif; }
  header { padding:40px 16px; max-width:1200px; margin:0 auto; }
  header h1 { font-family:"Cormorant Garamond",serif; font-weight:300; font-size:clamp(32px,6vw,56px); line-height:1.1; margin:0 0 12px; }
  header p { color:#666560; font-size:14px; max-width:60ch; margin:0; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:24px; padding:24px 16px 80px; max-width:1200px; margin:0 auto; }
  .card { display:block; border-radius:8px; overflow:hidden; background:#f5f3ed; text-decoration:none; color:inherit; }
  .card .thumb { aspect-ratio:1; position:relative; overflow:hidden; background:#e8e5dd; }
  .card .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:transform 500ms ease; }
  .card:hover .thumb img { transform:scale(1.04); }
  .card .meta { padding:14px; }
  .card .kicker { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#666560; font-weight:600; margin:0 0 6px; }
  .card .title { font-family:"Cormorant Garamond",serif; font-size:20px; line-height:1.2; margin:0 0 4px; }
  .card .title:hover { opacity:0.7; }
  .card .desc { font-size:13px; color:#666560; line-height:1.5; margin:0; }
  footer { border-top:1px solid #e8e5dd; padding:32px 16px 48px; max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#666560; flex-wrap:wrap; gap:12px; }
  .copy { font-size:12px; color:#666560; }
</style>
</head>
<body>

<nav class="shiro-nav bg-[#fbfbfa] flex items-center justify-between px-5 md:px-[80px] py-[32px] relative shrink-0 w-full border-b border-[#e8e5dd]">
  <a href="/" class="shiro-nav-brand font-semibold leading-normal text-[#111] text-[16px] whitespace-nowrap">RUDOLF WESTERHOLM | COMPOSER</a>
  <div class="shiro-nav-links flex gap-5 md:gap-[40px] items-center">
    <a href="/" class="nav-link-sh">MUSIC</a>
    <a href="/visuals/" class="nav-link-sh">VISUALS</a>
    <a href="/projects/" class="nav-link-sh">PROJECTS</a>
    <a href="/sites/" class="nav-link-sh">SITES</a>
    <a href="/cv/" class="nav-link-sh">CV</a>
    <a href="/reach/" class="nav-link-sh">REACH</a>
  </div>
</nav>

<header>
  <p class="eyebrow">Visual Arts</p>
  <h1 class="font-display font-light">Arts</h1>
  <p>A small selection of visual works and experiments.</p>
</header>

<div class="gallery">
  <a class="card" href="/visuals/">
    <div class="thumb">
      <img alt="Visuals" src="/assets/Imagination.png" loading="lazy" />
    </div>
    <div class="meta">
      <p class="kicker">Visuals</p>
      <p class="title">Visuals</p>
      <p class="desc">Moving image and visual work.</p>
    </div>
  </a>

  <a class="card" href="/assets/logo-full.svg">
    <div class="thumb">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
        <rect width="200" height="200" fill="#f5f3ed" />
        <circle cx="100" cy="100" r="70" fill="none" stroke="#111" stroke-width="6" />
        <text x="100" y="105" font-family="Cormorant Garamond, serif" font-size="26" font-weight="300" text-anchor="middle" fill="#111" letter-spacing="0.08em">RW</text>
      </svg>
    </div>
    <div class="meta">
      <p class="kicker">Brand</p>
      <p class="title">Logo Mark</p>
      <p class="desc">Rudolf Westerholm wordmark and logo.</p>
    </div>
  </a>
</div>

<footer>
  <span class="copy">© <span class="copyright-year">2026</span> Rudolf Westerholm.</span>
  <a href="/sites/" class="copy" style="text-decoration:underline">← Back to Sites</a>
</footer>
<script>document.querySelectorAll(".copyright-year").forEach(function(e){e.textContent=new Date().getFullYear();});</script>
</body>
</html>
