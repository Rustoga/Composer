<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  body { background:#0e0e0f; color:#f2f1ee; font-family:"Instrument Sans",sans-serif; -webkit-font-smoothing:antialiased; transition:background-color 750ms ease; }
  .theme-flip-in { opacity:0; animation: themeFade 750ms ease forwards; }
  @keyframes themeFade { from { opacity:0; } to { opacity:1; } }
  .font-display { font-family:"Cormorant Garamond",serif; }
  .eyebrow { font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:#9a978f; font-weight:600; }
  .nav-link-sh { font-size:12px; letter-spacing:0.04em; font-weight:500; color:#9a978f; cursor:pointer; position:relative; padding-bottom:4px; background:none; border:none; transition:color 160ms ease; }
  .nav-link-sh:hover { color:#fff; }
  .nav-link-sh.active { color:#fff; }
  .nav-link-sh.active::after { content:""; position:absolute; bottom:0; left:0; right:0; border-bottom:1px solid #fff; }
  .video-shell { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .video-shell iframe, .video-shell video { position:absolute; inset:0; width:100%; height:100%; border:0; display:block; }
  .feature-img { border-radius:8px; overflow:hidden; box-shadow:0 16px 32px rgba(0,0,0,0.05); }
  .feature-img img { width:100%; height:auto; display:block; }
  .gallery { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .gallery img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; display:block; }
  @media  (max-width:640px) { .gallery { grid-template-columns:1fr; } }
  .feature-img img, .gallery img { cursor:pointer; transition:opacity 160ms ease; }
  .feature-img img:hover, .gallery img:hover { opacity:0.85; }
  #lightbox { position:fixed; inset:0; background:rgba(20,20,18,0.92); display:none; align-items:center; justify-content:center; z-index:100; padding:5vw; cursor:zoom-out; }
  #lightbox.open { display:flex; }
  #lightbox img { max-width:100%; max-height:100%; border-radius:8px; object-fit:contain; }
  .rel-card .rc-thumb { overflow:hidden; border-radius:8px; aspect-ratio:4/3; background:#1a1a1c; }
  .rel-card .rc-thumb img { width:100%; height:100%; object-fit:cover; transition:transform 500ms ease; }
  .rel-card:hover .rc-thumb img { transform:scale(1.03); }
  .rel-card .rc-title { font-family:"Cormorant Garamond",serif; font-size:20px; margin-top:12px; }
  .back-link { display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:0.04em; font-weight:500; color:#9a978f; margin:24px 0 0 0; transition:color 160ms ease; }
  .back-link:hover { color:#fff; }
  @media (max-width:640px) {
    nav.shiro-nav { flex-direction: column; gap: 14px; align-items: flex-start; }
    nav.shiro-nav .shiro-nav-links { flex-wrap: wrap; gap: 14px 20px; }
  }
</style>
</head>

<script>document.querySelectorAll(".copyright-year").forEach(function(e){e.textContent=new Date().getFullYear();});</script>
<script>
  (function () {
    var doFlip = false;
    try { doFlip = sessionStorage.getItem("shiroThemeFlip") === "1"; } catch (e) {}
    if (!doFlip) return;
    try { sessionStorage.removeItem("shiroThemeFlip"); } catch (e) {}
    var body = document.body;
    var content = document.querySelector("main");
    body.style.transition = "none";
    body.style.backgroundColor = "#fbfbfa";
    if (content) { content.classList.add("theme-flip-in"); }
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        body.style.transition = "";
        body.style.backgroundColor = "#0e0e0f";
      });
    });
  })();
</script>
<div id="lightbox"><img alt=""></div>
<script>
  (function(){
    var lb = document.getElementById('lightbox');
    var lbImg = lb.querySelector('img');
    function open(src, alt){ lbImg.src = src; lbImg.alt = alt || ''; lb.classList.add('open'); }
    function close(){ lb.classList.remove('open'); lbImg.src = ''; }
    document.querySelectorAll('.feature-img img, .gallery img').forEach(function(img){
      img.addEventListener('click', function(){ open(img.src, img.alt); });
    });
    lb.addEventListener('click', close);
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  })();
</script>
</body></html>
