<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nature Spectrum — Rudolf Westerholm</title>
<style>
  *,::before,::after{box-sizing:border-box;margin:0;padding:0}
  body{background:#fbfbfa;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6;padding:1rem;min-height:100vh}
  h1{font-family:Georgia,"Times New Roman",Times,serif;font-size:40px;margin-bottom:12px}
  nav.top{width:100%;border-bottom:1px solid #e8e5dd;background:#fff;position:relative;z-index:50}
  .nav-inner{max-width:1200px;margin:0 auto;padding:0 1rem;display:flex;align-items:center;justify-content:space-between;height:64px}
  .brand{font-weight:600;font-size:16px;color:#111;white-space:nowrap}
  .nav-links{display:flex;gap:1.5rem;align-items:center}
  .nav-links a{font-size:14px;font-weight:500;color:#666560;padding:6px 0}
  .nav-links a.active{color:#0b7f5c;font-weight:600}
  .stage{max-width:1200px;margin:0 auto;padding:0 1rem 4rem}
  .spectrum-wrap{position:relative;width:100%;max-width:980px;background:#fff;border:1px solid #e8e5dd;border-radius:8px;overflow:hidden;margin:0 auto}
  .spectrum-canvas{width:100%;height:420px;display:block;background:#fafafa;cursor:crosshair}
</style>
</head>
<body>

<nav class="top">
  <div class="nav-inner">
    <a href="/" class="brand">RUDOLF WESTERHOLM | COMPOSER</a>
    <div class="nav-links">
      <a href="/nature/" class="active">NATURE SPECTRUM</a>
    </div>
  </div>
</nav>

<header style="padding:3rem 1rem 1rem;max-width:1200px;margin:0 auto">
  <h1>Nature Spectrum</h1>
  <p style="color:#666560;max-width:60ch">Move your mouse across the spectrum to see which sound groups live in each frequency band.</p>
</header>

<div class="stage">
  <div class="spectrum-wrap">
    <canvas id="spectrum" class="spectrum-canvas" width="980" height="420"></canvas>
  </div>
</div>

<script>
(function(){
  'use strict';
  var canvas = document.getElementById('spectrum');
  if(!canvas || !canvas.getContext){ console.log('no canvas'); return; }
  var ctx = canvas.getContext('2d');
  if(!ctx){ console.log('no ctx'); return; }
  ctx.fillStyle = '#0b7f5c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#fff';
  ctx.font = '24px sans-serif';
  ctx.fillText('Canvas + JS working!', 50, 50);
  console.log('JS executed successfully');
})();
</script>
</body>
</html>
