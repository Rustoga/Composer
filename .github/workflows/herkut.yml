name: Update Herkut & Leffat Snapshot

on:
  schedule:
    # Covers 06:00 and 19:00 Finnish time across both EET (UTC+2) and EEST (UTC+3)
    - cron: "0 3,4,16,17 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch-herkut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install requests certifi playwright
          playwright install chromium --with-deps

      - name: Fetch verified treats & cinema deals
        run: python scripts/fetch_herkut.py

      - name: Run self-check diagnostics
        id: selfcheck
        continue-on-error: true
        run: python scripts/fetch_herkut.py --self-check

      - name: Commit & push updated snapshot and health logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add herkku/herkku_snapshot.json logs/scraper_health.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(herkku): update verified snapshot & health diagnostics"
            git push
          fi

      - name: Open or update scraper-health issue on repeated failures
        if: steps.selfcheck.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const health = JSON.parse(fs.readFileSync('logs/scraper_health.json', 'utf8'));
            const body = [
              '### Herkku Scraper Health Alert',
              `Healthy sources: **${health.ok_sources}/${health.total_sources}**`,
              '',
              '```json',
              JSON.stringify(health.sources, null, 2),
              '```'
            ].join('\n');

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'scraper-health',
              state: 'open'
            });

            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Herkku scraper health warning',
                body,
                labels: ['scraper-health']
              });
            }
