<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokki - Gaussian Splat Cabin Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0b0f; color: #eef2ff; font-family: "Inter", sans-serif; }
      #canvas-container { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }
      .hint { font-family: "Syncopate", sans-serif; text-transform: uppercase; letter-spacing: 0.25rem; font-size: clamp(1rem, 2vw, 1.5rem); color: #f1f5f9; pointer-events: auto; }
      .sub { opacity: 0.7; font-size: 0.85rem; margin-top: 0.45rem; pointer-events: auto; }
      .btn { pointer-events: auto; margin-top: 0.6rem; padding: 0.45rem 0.9rem; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); color: #eef2ff; font-family: inherit; font-size: 0.8rem; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1rem; }
      .btn:hover { border-color: #fff; background: rgba(255,255,255,0.14); }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0b0f; z-index: 20; transition: opacity 0.4s ease; }
      #loading.hidden { opacity: 0; pointer-events: none; }
      .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.18); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="overlay">
        <div class="hint">Mokki</div>
        <div class="sub">WASD to move &bull; Mouse to look &bull; Click to lock cursor &bull; <span id="splat-count">loading splats&hellip;</span></div>
        <button class="btn" id="file-btn">Open .ply</button>
        <input type="file" id="file-input" accept=".ply" style="display: none;">
    </div>
    <div id="loading"><div class="spinner"></div><div>Loading splats&hellip;</div></div>
    <script type="module" src="mokki.js"></script>
</body>
</html>
