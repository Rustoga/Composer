<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mokki - Gaussian Splat Cabin Explorer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0b0f; color: #eef2ff; font-family: "Inter", sans-serif; }
      #canvas-container { width: 100%; height: 100%; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 10; }
      #hints { pointer-events: auto; text-align: center; margin-bottom: 0.6rem; }
      .hint { font-family: "Syncopate", sans-serif; text-transform: uppercase; letter-spacing: 0.25rem; font-size: clamp(1rem, 2vw, 1.4rem); color: #f1f5f9; display: block; }
      .sub { opacity: 0.7; font-size: 0.8rem; display: block; margin-top: 0.35rem; }
      .btn { pointer-events: auto; padding: 0.45rem 0.95rem; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); color: #eef2ff; font-family: inherit; font-size: 0.75rem; border-radius: 4px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.1rem; margin: 0.25rem 0.35rem; }
      .btn:hover { border-color: #fff; background: rgba(255,255,255,0.14); }
      .btn.active { background: rgba(255,255,255,0.2); border-color: #fff; }
      #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0b0f; z-index: 20; transition: opacity 0.4s ease; }
      #loading.hidden { opacity: 0; pointer-events: none; }
      #error { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(11,11,15,0.92); z-index: 30; text-align: center; padding: 1rem; }
      #error.visible { display: flex; }
      .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.18); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #splat-count { font-size: 0.8rem; opacity: 0.6; margin-top: 0.25rem; }
      .err-msg { color: #ff6b6b; margin: 0.5rem 0; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui">
        <div id="hints">
            <span class="hint">Mokki</span>
            <span class="sub" id="control-hint">Drag to look &bull; Pinch to zoom &bull; WASD to fly &bull; <span id="splat-count">loading engine&hellip;</span></span>
        </div>
        <div>
            <button class="btn" id="btn-autofly">Auto fly</button>
            <button class="btn" id="btn-reset">Reset view</button>
            <button class="btn" id="btn-reload" style="border-color:#ff6b6b;color:#ff6b6b;">Reload</button>
            <button class="btn" id="btn-file">Open .ply</button>
            <input type="file" id="file-input" accept=".ply" style="display: none;">
        </div>
    </div>
    <div id="loading"><div class="spinner"></div><div>Loading engine&hellip;</div></div>
    <div id="error"><div class="err-msg" id="error-msg"></div><button class="btn" id="btn-error-retry" style="border-color:#fff;color:#fff;margin-top:0.5rem;">Try again</button></div>
    <script type="module" src="mokki.js"></script>
</body>
</html>
